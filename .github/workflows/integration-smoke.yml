name: Integration sandbox smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-provider-smoke:
    runs-on: ubuntu-latest
    environment: integration-sandbox
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_PASSWORD: integration-smoke-unused
      JWT_SECRET: integration-smoke-unused
      DEFAULT_ADMIN_PASSWORD: integration-smoke-unused
      APP_ENV: test
      PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_API_BASE_URL: ${{ secrets.PLAID_API_BASE_URL }}
      QBO_SANDBOX_ACCESS_TOKEN: ${{ secrets.QBO_SANDBOX_ACCESS_TOKEN }}
      QBO_SANDBOX_REALM_ID: ${{ secrets.QBO_SANDBOX_REALM_ID }}
      QBO_API_BASE_URL: ${{ secrets.QBO_API_BASE_URL }}
      SCREENING_API_KEY: ${{ secrets.SCREENING_API_KEY }}
      SCREENING_HEALTH_URL: ${{ secrets.SCREENING_HEALTH_URL }}
      SSO_SANDBOX_ISSUER: ${{ secrets.SSO_SANDBOX_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run non-mutating sandbox checks
        run: pytest -m integration tests/test_integration_smoke.py -rs --strict-markers